# /etc/kryptoport.conf — configuration for kppm (the kryptoport package manager).
# Sourced by `ayo` as bash. Anything set here is overridable by a KPPM_* env var.

# Recipe tree (git): `ayo update` clones/pulls this.
KPPM_TREE_URL="https://github.com/t3m3d/kryptoport-tree.git"

# Binary repo holding <name>-<version>.kpkg + an `index` file. Empty = build
# everything from source. Set this once a build farm publishes binaries.
KPPM_BINREPO_URL=""

# Architecture for binary packages (default: this machine's `uname -m`).
# KPPM_ARCH="x86_64"

# Paths (defaults shown; uncomment to relocate).
# KPPM_ROOT="/var/lib/kryptoport"        # tree + db + index live here
# KPPM_CACHE="/var/cache/kryptoport/src" # downloaded source tarballs
# KPPM_BINCACHE="/var/cache/kryptoport/bin"
